<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRANG THÔNG TIN MỘ LIỆT SĨ Ở NGHĨA TRANG LIỆT SĨ XÃ MINH LONG</title>
    
    <style>
        /* === PHẦN CSS: GIAO DIỆN === */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        
        .header { position: relative; width: 100%; height: 300px; background-color: #333; }
        .banner-img { width: 100%; height: 100%; object-fit: cover; }

        /* Menu Dropdown */
        .menu-container { position: absolute; top: 20px; right: 20px; }
        .menu-btn { padding: 10px 20px; background: rgba(255,255,255,0.9); border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .dropdown-content { display: none; position: absolute; right: 0; background-color: #fff; min-width: 160px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); z-index: 1; border-radius: 5px; overflow: hidden; margin-top: 5px; }
        .dropdown-content a { color: black; padding: 12px 16px; text-decoration: none; display: block; cursor: pointer; }
        .dropdown-content a:hover { background-color: #f1f1f1; }
        .show { display: block; }

        /* Phần hiển thị sách */
        .main-content { padding: 30px; max-width: 1200px; margin: auto; }
        .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .book-card { border: 1px solid #ddd; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; transition: 0.2s; background: #f9f9f9; }
        .book-card:hover { transform: scale(1.05); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .book-card img { width: 100%; height: 250px; object-fit: cover; border-radius: 4px; }
        .book-card h4 { margin-top: 10px; font-size: 16px; color: #333; }

        /* Modal Dùng Chung */
        .modal { display: none; position: fixed; z-index: 10; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); }
        .modal-content { background-color: #fff; margin: 5% auto; padding: 20px; border-radius: 8px; width: 90%; max-width: 500px; position: relative; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; color: #555; }
        
        /* Modal Chi Tiết Sách */
        .modal-body { display: flex; gap: 20px; margin-top: 10px; }
        .modal-body img { width: 150px; height: 220px; object-fit: cover; border-radius: 4px; }
        .modal-info { display: flex; flex-direction: column; gap: 10px; }
        .action-btns { margin-top: 15px; display: none; gap: 10px; } /* Mặc định ẩn nút sửa xóa */
        .btn { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; }
        .btn-edit { background: #4CAF50; }
        .btn-delete { background: #f44336; }
        
        /* Form Thêm/Sửa Sách */
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-submit { background: #008CBA; width: 100%; padding: 10px; margin-top: 10px; }

        /* Responsive cho điện thoại */
        @media (max-width: 768px) {
            .header { height: 180px; }
            .modal-body { flex-direction: column; align-items: center; text-align: center; }
            .action-btns { justify-content: center; }
        }

        /* Lớp phủ màn hình tải */
        #loadingOverlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.8); z-index: 9999; text-align: center; padding-top: 20%; font-size: 20px; font-weight: bold;}
    </style>
</head>
<body>

    <!-- === PHẦN HTML: BỐ CỤC === -->
    <div id="loadingOverlay">Đang xử lý dữ liệu, vui lòng đợi...</div>

    <!-- Header & Menu -->
    <header class="header">
        <img src="https://via.placeholder.com/1200x300?text=Banner+Thư+Viện" alt="Banner" class="banner-img">
        <div class="menu-container">
            <button class="menu-btn" id="menuBtn">☰ Menu</button>
            <div class="dropdown-content" id="dropdownMenu">
                <a id="loginMenu">Đăng nhập Quản trị</a>
                <a id="addMenu" style="display: none;">+ Thêm mới</a>
                <a id="logoutMenu" style="display: none; color: red;">Đăng xuất</a>
            </div>
        </div>
    </header>

    <main class="main-content">
        <h2>CÁC THÔNG TIN MỘ LIỆT SĨ</h2>
        <div class="book-grid" id="bookGrid">
            <!-- Sách sẽ được load từ Firebase vào đây -->
        </div>
    </main>

    <!-- Modal Chi Tiết Sách -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeDetail">&times;</span>
            <div class="modal-body">
                <img id="detailImg" src="" alt="">
                <div class="modal-info">
                    <h3 id="detailTitle"></h3>
                    <p><strong>Thông tin:</strong> <span id="detailDesc"></span></p>
                    <p><strong>Vị trí:</strong> Hàng <span id="detailRow"></span> - Cột <span id="detailCol"></span></p>
                    
                    <!-- Nút này chỉ hiện khi ĐÚNG Admin đã đăng nhập -->
                    <div class="action-btns" id="actionBtns">
                        <button class="btn btn-edit" id="btnEdit">Sửa sách</button>
                        <button class="btn btn-delete" id="btnDelete">Xóa sách</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Form Thêm/Sửa Sách -->
    <div id="formModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeForm">&times;</span>
            <h3 id="formTitle" style="margin-bottom: 15px;">Thêm Sách Mới</h3>
            <form id="bookForm">
                <div class="form-group">
                    <label>Tên liệt sĩ:</label>
                    <input type="text" id="inputTitle" required>
                </div>
                <div class="form-group">
                    <label>Thông tin / Mô tả của liệt sĩ:</label>
                    <textarea id="inputDesc" rows="3" required></textarea>
                </div>
                <div class="form-group" style="flex-direction: row; gap: 10px;">
                    <div style="flex: 1;">
                        <label>Hàng số:</label>
                        <input type="number" id="inputRow" required style="width: 100%;">
                    </div>
                    <div style="flex: 1;">
                        <label>Cột số:</label>
                        <input type="number" id="inputCol" required style="width: 100%;">
                    </div>
                </div>
                <div class="form-group">
                    <label>Hình ảnh mộ liệt sĩ (Để trống nếu giữ ảnh cũ khi sửa):</label>
                    <input type="file" id="inputFile" accept="image/*">
                </div>
                <button type="submit" class="btn btn-submit">Lưu Dữ Liệu</button>
            </form>
        </div>
    </div>

    <!-- === PHẦN JAVASCRIPT: LOGIC & FIREBASE === -->
    <script type="module">
        // Import thư viện Firebase (Đã bỏ qua Storage vì dùng ImgBB)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // =========================================================================
        // 1. [BẠN CẦN ĐIỀN] - CẤU HÌNH FIREBASE CỦA BẠN 
        // =========================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAesxOPNDlqNSzJk20-hH3Jr3rBdvr8VGU",
            authDomain: "ntls-xaminhlong.firebaseapp.com",
            projectId: "ntls-xaminhlong",
            storageBucket: "ntls-xaminhlong.firebasestorage.app",
            messagingSenderId: "968372605850",
            appId: "1:968372605850:web:b9aefb31398e15b4a8a023"
        };

        // =========================================================================
        // 2. [BẠN CẦN ĐIỀN] - THÔNG TIN ADMIN & API KEY
        // =========================================================================
        const ADMIN_EMAIL = "unapiml@gmail.com"; // Chỉ định email được phép sửa xóa
        const IMGBB_API_KEY = "ac94465f6639a9bd0a8ea2a1791efe7a"; // Lấy từ api.imgbb.com

        // Khởi tạo Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Các biến UI
        const loadingOverlay = document.getElementById('loadingOverlay');
        const bookGrid = document.getElementById('bookGrid');
        let isAdmin = false; 
        let currentEditingId = null;
        let currentEditingImgUrl = "";
        let currentSelectedBook = null;

        // --- XỬ LÝ MENU DROP DOWN ---
        document.getElementById('menuBtn').addEventListener('click', () => {
            document.getElementById('dropdownMenu').classList.toggle('show');
        });
        window.addEventListener('click', (e) => {
            if (!e.target.matches('.menu-btn')) {
                const dropdowns = document.getElementsByClassName("dropdown-content");
                for (let i = 0; i < dropdowns.length; i++) {
                    if (dropdowns[i].classList.contains('show')) dropdowns[i].classList.remove('show');
                }
            }
        });

        // --- XÁC THỰC NGƯỜI DÙNG (LOGIN / LOGOUT) ---
        const provider = new GoogleAuthProvider();
        
        document.getElementById('loginMenu').addEventListener('click', () => {
            signInWithPopup(auth, provider).catch(error => alert("Lỗi đăng nhập: " + error.message));
        });
        
        document.getElementById('logoutMenu').addEventListener('click', () => {
            signOut(auth).then(() => alert("Đã đăng xuất!"));
        });

        // Kiểm tra quyền truy cập khi trạng thái đăng nhập thay đổi
        onAuthStateChanged(auth, (user) => {
            if (user) {
                if (user.email === ADMIN_EMAIL) {
                    isAdmin = true;
                    document.getElementById('loginMenu').style.display = 'none';
                    document.getElementById('addMenu').style.display = 'block';
                    document.getElementById('logoutMenu').style.display = 'block';
                    document.getElementById('menuBtn').innerText = `☰ Quản lý`;
                    if(currentSelectedBook) document.getElementById('actionBtns').style.display = 'flex';
                } else {
                    alert("Cảnh báo: Tài khoản này không có quyền quản trị thư viện!");
                    signOut(auth);
                }
            } else {
                isAdmin = false;
                document.getElementById('loginMenu').style.display = 'block';
                document.getElementById('addMenu').style.display = 'none';
                document.getElementById('logoutMenu').style.display = 'none';
                document.getElementById('menuBtn').innerText = `☰ Menu`;
                document.getElementById('actionBtns').style.display = 'none';
            }
        });

        // --- LOAD DỮ LIỆU SÁCH TỪ FIRESTORE ---
        async function loadBooks() {
            bookGrid.innerHTML = '<i>Đang tải dữ liệu...</i>';
            try {
                const querySnapshot = await getDocs(collection(db, "books"));
                bookGrid.innerHTML = '';
                querySnapshot.forEach((doc) => {
                    const book = doc.data();
                    book.id = doc.id;
                    renderBookCard(book);
                });
            } catch (error) {
                bookGrid.innerHTML = '<b style="color:red">Lỗi tải dữ liệu. Cấu hình đúng Firebase chưa?</b>';
                console.error(error);
            }
        }

        function renderBookCard(book) {
            const card = document.createElement('div');
            card.className = 'book-card';
            card.innerHTML = `<img src="${book.imageUrl}" alt="${book.title}"><h4>${book.title}</h4>`;
            card.addEventListener('click', () => openDetailModal(book));
            bookGrid.appendChild(card);
        }

        // --- XỬ LÝ MODAL CHI TIẾT SÁCH ---
        const detailModal = document.getElementById('detailModal');
        
        function openDetailModal(book) {
            currentSelectedBook = book;
            document.getElementById('detailImg').src = book.imageUrl;
            document.getElementById('detailTitle').innerText = book.title;
            document.getElementById('detailDesc').innerText = book.description;
            document.getElementById('detailRow').innerText = book.row;
            document.getElementById('detailCol').innerText = book.col;
            
            document.getElementById('actionBtns').style.display = isAdmin ? 'flex' : 'none';
            detailModal.style.display = 'block';
        }

        document.getElementById('closeDetail').addEventListener('click', () => detailModal.style.display = 'none');

        // --- HÀM TẢI ẢNH LÊN IMGBB (MIỄN PHÍ) ---
        async function uploadImageToImgBB(file) {
            const formData = new FormData();
            formData.append('image', file);
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            if (data.success) return data.data.url;
            else throw new Error("Lỗi tải ảnh lên ImgBB");
        }

        // --- XỬ LÝ FORM THÊM / SỬA SÁCH ---
        const formModal = document.getElementById('formModal');
        const bookForm = document.getElementById('bookForm');

        document.getElementById('addMenu').addEventListener('click', () => {
            currentEditingId = null;
            document.getElementById('formTitle').innerText = "Thêm Mới";
            bookForm.reset();
            formModal.style.display = 'block';
        });

        document.getElementById('btnEdit').addEventListener('click', () => {
            detailModal.style.display = 'none';
            currentEditingId = currentSelectedBook.id;
            currentEditingImgUrl = currentSelectedBook.imageUrl;
            
            document.getElementById('formTitle').innerText = "Sửa Thông Tin Mộ Liệt Sĩ";
            document.getElementById('inputTitle').value = currentSelectedBook.title;
            document.getElementById('inputDesc').value = currentSelectedBook.description;
            document.getElementById('inputRow').value = currentSelectedBook.row;
            document.getElementById('inputCol').value = currentSelectedBook.col;
            document.getElementById('inputFile').value = ""; 
            
            formModal.style.display = 'block';
        });

        bookForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loadingOverlay.style.display = 'block';

            const file = document.getElementById('inputFile').files[0];
            let imageUrl = currentEditingImgUrl; 

            try {
                if (file) {
                    imageUrl = await uploadImageToImgBB(file);
                } else if (!currentEditingId) {
                    imageUrl = "https://via.placeholder.com/150x220?text=No+Image";
                }

                const bookData = {
                    title: document.getElementById('inputTitle').value,
                    description: document.getElementById('inputDesc').value,
                    row: document.getElementById('inputRow').value,
                    col: document.getElementById('inputCol').value,
                    imageUrl: imageUrl 
                };

                if (currentEditingId) {
                    await updateDoc(doc(db, "books", currentEditingId), bookData);
                    alert("Cập nhật thành công!");
                } else {
                    await addDoc(collection(db, "books"), bookData);
                    alert("Thêm thành công!");
                }
                
                formModal.style.display = 'none';
                loadBooks(); 
            } catch (error) {
                alert("Lỗi: " + error.message);
            }
            loadingOverlay.style.display = 'none';
        });

        document.getElementById('closeForm').addEventListener('click', () => formModal.style.display = 'none');

        // --- XÓA SÁCH ---
        document.getElementById('btnDelete').addEventListener('click', async () => {
            if(confirm("Bạn có chắc chắn muốn xóa thông tin này?")) {
                loadingOverlay.style.display = 'block';
                try {
                    await deleteDoc(doc(db, "books", currentSelectedBook.id));
                    alert("Đã xóa sách!");
                    detailModal.style.display = 'none';
                    loadBooks(); 
                } catch (error) {
                    alert("Lỗi xóa: " + error.message);
                }
                loadingOverlay.style.display = 'none';
            }
        });

        // Khởi chạy load dữ liệu
        loadBooks();
    </script>
</body>
</html>
